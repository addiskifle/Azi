<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Azi Words"><meta name="theme-color" content="#0b1f4d"><title>Azi's World of Words</title>
<style>
:root{--navy:#0b1f4d;--sky:#5bb8f5;--green:#12a150;--lime:#b6f23a;--gold:#ffd23f;--orange:#ff7a1a;--red:#ee3b4b;--pink:#ff5fa2;--purple:#7c4dff;--paper:#fff;--muted:#5d6b8a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Chalkboard SE","Comic Sans MS","Marker Felt","Trebuchet MS",system-ui,sans-serif;color:var(--navy);background:linear-gradient(180deg,#59b9ff 0,#c4ecff 260px,#0000 261px),repeating-linear-gradient(90deg,#22b45a 0 80px,#2cc967 80px 160px);background-attachment:scroll;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
html{background:#22b45a}
header{padding-top:max(14px,env(safe-area-inset-top))!important;background:radial-gradient(circle at 6% 0,#fffb 0,#fff0 12%),radial-gradient(circle at 94% 0,#fffb 0,#fff0 12%),linear-gradient(180deg,#0b1f4d,#17409b);color:#fff;padding:14px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:6px solid var(--gold);box-shadow:0 6px 0 var(--orange)}
.brand{font-weight:1000;letter-spacing:1px;font-size:1.15rem;text-shadow:0 2px 0 #0007}.brand span{display:inline-grid;place-items:center;background:linear-gradient(135deg,var(--lime),var(--gold));color:var(--navy);width:42px;height:42px;border-radius:50%;margin-right:10px;animation:spin 6s linear infinite;border:3px solid #fff}
#points{background:var(--gold);color:#382900;padding:9px 16px;border-radius:30px;font-weight:1000;border:3px solid #fff;box-shadow:0 3px 0 #d9a400}
main{max-width:1150px;margin:auto;padding:28px 18px 55px}
button{-webkit-appearance:none;appearance:none;min-height:48px;user-select:none;-webkit-user-select:none;border:0;border-radius:16px;padding:13px 18px;background:linear-gradient(180deg,#25c36d,#12a150);color:#fff;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #087346;transition:transform .12s}
@media(hover:hover){button:hover{filter:brightness(1.07);transform:translateY(-2px) scale(1.03)}}button:active{transform:translateY(3px);box-shadow:0 2px 0 #087346}
button.secondary{background:#fff;color:var(--navy);border:3px solid var(--sky);box-shadow:0 5px 0 #3b97d4}
button.gold{background:linear-gradient(180deg,#ffe066,var(--gold));color:#4a3300;box-shadow:0 5px 0 #d6a42d}
button.danger{background:linear-gradient(180deg,#ff6b78,var(--red));box-shadow:0 5px 0 #a92e38}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.hero{background:radial-gradient(circle at 10% 0,#fff9 0,#fff0 18%),radial-gradient(circle at 90% 0,#fff9 0,#fff0 18%),linear-gradient(180deg,#0b1f4d 0,#17409b 55%,#1ca653 55%,#22b45a 100%);color:#fff;padding:clamp(24px,5vw,50px);border-radius:30px;position:relative;overflow:hidden;border:5px solid var(--gold);box-shadow:0 8px 0 #d9a400,0 18px 30px #0b1f4d33;min-height:340px}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);line-height:1.02;margin:10px 0;text-shadow:0 4px 0 #0b1f4d99}.hero h1 b{color:var(--gold)}
.hero p{max-width:470px;color:#fff;line-height:1.6;font-size:1.1rem}
.hero .eyebrow,.hero h1,.hero p,.hero .actions{position:relative;z-index:2}
.mascot{position:absolute;right:4%;bottom:-6px;width:min(220px,34vw);animation:bob 2.2s ease-in-out infinite;z-index:1}
.sticker{position:absolute;font-size:2.2rem;animation:float 3s ease-in-out infinite;z-index:1}
.st1{top:10%;right:38%}.st2{top:48%;right:46%;animation-delay:.6s}.st3{top:8%;right:8%;animation-delay:1.1s}.st4{bottom:12%;right:30%;animation-delay:.3s}
.eyebrow{font-size:.8rem;font-weight:1000;letter-spacing:2px;color:var(--lime)}
.actions,.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.flags{margin-top:20px;background:#fff;border:4px solid var(--navy);border-radius:20px;padding:10px;font-size:2rem;text-align:center;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;box-shadow:0 6px 0 #0b1f4d33}.flags span{display:inline-block;animation:wiggle 2.4s ease-in-out infinite}.flags span:nth-child(2n){animation-delay:.4s}.flags span:nth-child(3n){animation-delay:.8s}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-top:20px}
.card,.stage,.game{background:#fff;border:4px solid var(--navy);border-radius:24px;padding:20px;box-shadow:0 7px 0 #0b1f4d33}
.card.c1{border-color:var(--orange);background:#fff3e2}.card.c2{border-color:var(--sky);background:#e6f6ff}.card.c3{border-color:var(--pink);background:#ffeaf4}
.muted{color:var(--muted)}.big{font-size:2.2rem;font-weight:1000;color:var(--purple)}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 20px;background:#ffffffd9;border-radius:22px;padding:14px 18px;border:3px solid #fff}.head h1,.head h2{margin:4px 0}
.layout{display:grid;grid-template-columns:minmax(245px,340px) 1fr;gap:18px}
.listmenu{display:flex;flex-direction:column;gap:10px;max-height:68vh;overflow:auto;padding:4px 6px 8px 2px}
.listbtn{background:#fff;color:var(--navy);box-shadow:0 4px 0 #0b1f4d22;border:3px solid #e1eaf0;border-left:14px solid var(--tc,var(--sky));text-align:left;width:100%;padding:12px}
.listbtn.active{border-color:var(--gold);border-left-color:var(--tc,var(--sky));background:#fff8cf;transform:scale(1.02)}
.rowtop{display:flex;justify-content:space-between;gap:8px}
.bar{height:14px;background:#e3ecf5;border-radius:20px;overflow:hidden;margin-top:7px;border:2px solid #fff;box-shadow:inset 0 2px 3px #0b1f4d22}.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--orange) 0 12px,var(--gold) 12px 24px);border-radius:20px;transition:width .4s}
.tag{display:inline-block;background:#fff;border:2px solid var(--sky);border-radius:20px;padding:3px 9px;font-size:.74rem;font-weight:900}.today{background:var(--lime);border-color:var(--green);color:#075c33}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.stage{text-align:center;transition:transform .15s}.stage:hover{transform:translateY(-4px) rotate(-.6deg)}
.stage p{color:var(--muted);min-height:45px}.stage .icon{font-size:3rem;animation:bob 2.4s ease-in-out infinite}
.stage.s1{border-color:var(--orange);background:linear-gradient(#fff,#ffeed6)}.stage.s2{border-color:var(--sky);background:linear-gradient(#fff,#dff2ff)}.stage.s3{border-color:var(--red);background:linear-gradient(#fff,#ffe3e6)}
.stage.s1 button{background:linear-gradient(180deg,#ff9a4a,var(--orange));box-shadow:0 5px 0 #c25400}.stage.s2 button{background:linear-gradient(180deg,#7ccbff,var(--sky));box-shadow:0 5px 0 #2f8ccc}.stage.s3 button{background:linear-gradient(180deg,#ff6b78,var(--red));box-shadow:0 5px 0 #a92e38}
.stage .toolbar{justify-content:center}
.game{max-width:780px;margin:20px auto;text-align:center;padding:clamp(18px,4vw,35px);border:5px solid var(--gold);background:linear-gradient(180deg,#fff 0,#fffdf0 100%);box-shadow:0 8px 0 #d9a400,0 18px 30px #0b1f4d22}
.word{font-size:clamp(2.5rem,8vw,4.2rem);font-weight:1000;margin:16px 0;background:linear-gradient(90deg,var(--red),var(--orange),#e0a800,var(--green),var(--sky),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.meaning{font-size:1.25rem;color:var(--green);font-weight:850}
.chip{display:inline-block;background:var(--sky);color:#fff;border-radius:30px;padding:8px 18px;font-weight:1000;font-size:1.15rem;border:3px solid #fff;box-shadow:0 4px 0 #2f8ccc;margin:6px 0 10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin:20px 0}
.choice{color:var(--navy);border:3px solid;font-size:1.05rem}
.choice:nth-child(4n+1){background:#ffe6c9;border-color:var(--orange);box-shadow:0 5px 0 #c25400}.choice:nth-child(4n+2){background:#d9f0ff;border-color:var(--sky);box-shadow:0 5px 0 #2f8ccc}.choice:nth-child(4n+3){background:#ffdde2;border-color:var(--red);box-shadow:0 5px 0 #a92e38}.choice:nth-child(4n){background:#e0f9d0;border-color:var(--green);box-shadow:0 5px 0 #087346}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:17px}
.tile{color:var(--navy);box-shadow:0 4px 0 #0b1f4d33;border:3px solid var(--navy);min-width:46px;font-size:1.2rem;background:#fff}
.tiles .tile:nth-child(4n+1){background:#ffe6c9}.tiles .tile:nth-child(4n+2){background:#d9f0ff}.tiles .tile:nth-child(4n+3){background:#ffdde2}.tiles .tile:nth-child(4n){background:#e0f9d0}
.answer{min-height:58px;border:3px dashed var(--sky);background:#f2fbff;border-radius:16px;display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;padding:8px}
.feedback{font-weight:900;min-height:30px;margin:12px;font-size:1.15rem}.feedback.win{animation:pop .5s}
.notice{background:#fff5d7;border:2px solid #ecd999;color:#6e5100;border-radius:14px;padding:13px}.good{background:#e4f8eb;border:2px solid #b9e7c9;color:#12663c;border-radius:14px;padding:13px}
.sent{margin:12px 0;text-align:left;background:#fff;border:3px solid var(--sky);border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 #3b97d4}
.sent:nth-of-type(3n+2){border-color:var(--orange);box-shadow:0 5px 0 #c25400}.sent:nth-of-type(3n){border-color:var(--pink);box-shadow:0 5px 0 #c23a7a}
.sent p{font-size:1.2rem;font-weight:800;line-height:2.3;margin:8px 0}
input.blank{display:inline-block;font:inherit;font-weight:1000;text-align:center;color:var(--navy);background:#fff6c9;border:0;border-bottom:5px dashed var(--orange);border-radius:12px 12px 0 0;padding:2px 6px;margin:0 4px;width:auto}
input.blank:focus{outline:none;background:#fff0a0;border-bottom-color:var(--purple)}
input.blank.ok{background:#d6f8e2;border-bottom:5px solid var(--green);color:#0a7a3b}input.blank.bad{background:#ffdfe2;border-bottom:5px solid var(--red);color:#b5222f}
.fix{display:inline-block;background:var(--lime);color:#075c33;font-weight:1000;border-radius:12px;padding:2px 10px;font-size:.95rem;margin-left:4px}
input,select,textarea{font-size:16px;width:100%;padding:10px;border:2px solid #cbd8e2;border-radius:12px;font:inherit}
label{display:block;font-weight:800;font-size:.85rem;margin:9px 0 5px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}
table{border-collapse:collapse;width:100%;font-size:.87rem}td,th{padding:9px;border-bottom:1px solid #e4edf2;text-align:left;vertical-align:top}th{background:#f0f5f7}
.scroll{overflow:auto}.hidden{display:none!important}
.footer{text-align:center;color:#fff;background:var(--navy);padding:20px;font-size:.85rem}
.confetti{position:fixed;top:-50px;z-index:99;pointer-events:none;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(8deg)}}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@media(max-width:780px){.layout,.stages{grid-template-columns:1fr}.listmenu{max-height:330px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.mascot{opacity:.9;width:130px}.hero{min-height:420px}}

.hero2{display:grid;grid-template-columns:minmax(150px,1fr) minmax(280px,1.5fr) minmax(150px,1fr);gap:clamp(12px,2.5vw,28px);align-items:center;background:radial-gradient(circle at 50% 0,#fff8 0,#fff0 30%),linear-gradient(180deg,#0b1f4d 0,#17409b 55%,#1ca653 55%,#22b45a 100%);color:#fff;padding:clamp(18px,3vw,34px);border-radius:30px;border:5px solid var(--gold);box-shadow:0 8px 0 #d9a400,0 18px 30px #0b1f4d33;position:relative;overflow:hidden}
.hero2 .mid{text-align:center;position:relative;z-index:2}
.hero2 .mid h1{font-size:clamp(2.2rem,5.4vw,4rem);line-height:1.04;margin:8px 0;text-shadow:0 4px 0 #0b1f4d99}.hero2 .mid h1 b{color:var(--gold)}
.hero2 .mid p{color:#fff;line-height:1.55;font-size:1.05rem;margin:8px auto;max-width:430px}
.hero2 .actions{justify-content:center}
.player{position:relative;margin:0;border-radius:24px;border:5px solid #fff;overflow:hidden;box-shadow:0 8px 0 #0006;aspect-ratio:3/4.1;background:#fff}
.player img{width:100%;height:100%;object-fit:cover;display:block}
.player.l{transform:rotate(-3deg);border-color:#8fd4ff}.player.r{transform:rotate(3deg);border-color:#ffd23f}
.player.l,.player.r{animation:sway 4s ease-in-out infinite}.player.r{animation-delay:1.2s}
.player span{position:absolute;left:0;right:0;bottom:0;text-align:center;font-weight:1000;font-size:1rem;padding:6px 4px;color:#fff;text-shadow:0 2px 0 #0008}
.player.l span{background:linear-gradient(90deg,#3d9be0cc,#5bb8f5cc)}.player.r span{background:linear-gradient(90deg,#d99b00cc,#12a150cc)}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-1deg) translateY(-8px)}}
.player.r{animation-name:sway2}@keyframes sway2{0%,100%{transform:rotate(3deg) translateY(0)}50%{transform:rotate(1deg) translateY(-8px)}}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.opt{min-height:50px;min-width:92px;padding:10px 16px;font-size:1.05rem;color:var(--navy);background:#fff;border:3px solid var(--sky);box-shadow:0 5px 0 #3b97d4}
.opt:nth-child(4n+1){background:#ffe6c9;border-color:var(--orange);box-shadow:0 5px 0 #c25400}.opt:nth-child(4n+2){background:#d9f0ff}.opt:nth-child(4n+3){background:#ffdde2;border-color:var(--red);box-shadow:0 5px 0 #a92e38}.opt:nth-child(4n){background:#e0f9d0;border-color:var(--green);box-shadow:0 5px 0 #087346}
.opt.on{outline:5px solid var(--purple);transform:scale(1.06)}
.or{font-size:.8rem;font-weight:900;color:var(--muted);margin:2px 0}
.tile{min-height:50px;min-width:50px}
@media(max-width:860px){.hero2{grid-template-columns:1fr 1fr;grid-template-areas:"m m" "l r"}.hero2 .mid{grid-area:m}.hero2 .pl{grid-area:l}.hero2 .pr{grid-area:r}}
@media(min-width:700px) and (max-width:1100px){.stages{grid-template-columns:repeat(3,1fr);gap:12px}.stage{padding:14px}.stage h2{font-size:1.15rem}}
</style></head><body>

const BUILTIN_VOCAB=[{"id":"src-1","list":1,"french":"assez","english":"enough","sentences":["J'ai assez mangé.","Il y a assez de jus pour tout le monde.","Tu as assez dormi cette nuit ?"]},{"id":"src-2","list":1,"french":"rien","english":"nothing","sentences":["Il n'y a rien dans la boîte.","Je n'ai rien à dire.","Rien n'est plus doux qu'un câlin."]},{"id":"src-3","list":1,"french":"bienvenu","english":"welcome","sentences":["Sois le bienvenu chez nous !","Le chat est toujours bienvenu dans la cuisine.","Un bon repas est bienvenu après l'école."]},{"id":"src-4","list":1,"french":"aujourd'hui","english":"today","sentences":["Aujourd'hui, il fait beau.","Aujourd'hui, c'est mon anniversaire.","Qu'est-ce que tu manges aujourd'hui ?"]},{"id":"src-5","list":1,"french":"dès","english":"from, as soon as","sentences":["Dès le matin, je joue dehors.","Dès que la cloche sonne, nous sortons.","Dès demain, je range ma chambre."]},{"id":"src-6","list":1,"french":"tant","english":"so much, so many","sentences":["J'aime tant ma grand-mère.","Il y a tant de neige !","Elle a tant ri qu'elle a pleuré."]},{"id":"src-7","list":1,"french":"aussitôt","english":"immediately","sentences":["Aussitôt arrivé, il enlève son manteau.","Aussitôt la pluie finie, nous sortons.","Elle a ri aussitôt."]},{"id":"src-8","list":1,"french":"tantôt","english":"a while ago / later today","sentences":["Je t'ai vu tantôt à l'école.","Je viendrai tantôt, après le dîner.","Tantôt il rit, tantôt il pleure."]},{"id":"src-9","list":1,"french":"maintenant","english":"now","sentences":["Maintenant, c'est l'heure du dîner.","Je dois partir maintenant.","Maintenant, tu peux jouer."]},{"id":"src-10","list":1,"french":"bien","english":"well, good","sentences":["Tu dessines très bien.","J'ai bien dormi.","Il est bien content."]},{"id":"src-11","list":1,"french":"tôt","english":"early","sentences":["Je me lève tôt le matin.","Il est trop tôt pour dîner.","Papa part tôt au travail."]},{"id":"src-12","list":1,"french":"par function choose(){let a=data.assign[today()];show(`<div class="head"><div><div class="eyebrow" style="color:var(--green)">FOOTBALL + GEOGRAPHY ADVENTURE</div><h1>Choose your list, Azi!</h1><p class="muted">Pick one list for today's learning mission. Progress is saved separately for each list.</p></div><button class="secondary" onclick="home()">← Home</button></div><div class="layout"><div class="listmenu">${lists().map(n=>{let s=stats(n);return `<button class="listbtn ${data.selected===n?'active':''}" style="--tc:${teamOf(n).c}" onclick="selectList(${n})"><div class="rowtop"><b>${teamOf(n).flag} Liste ${n} ${a===n?'<span class="tag today">TODAY</span>':''}</b><b>${s.pct}%</b></div><small class="muted">${s.count} approved words · ${s.m} mastered ${s.count?'':'· waiting for words'}</small><div class="bar"><i style="width:${s.pct}%"></i></div></button>`}).join('')}</div><div class="card"><div class="eyebrow" style="color:var(--green)">SELECTED LEARNING MISSION</div><h2>Liste ${data.selected}</h2><div class="big">${stats(data.selected).count} words</div><p class="muted">All games in this mission use only words from this approved list.</p><button onclick="dashboard(${data.selected})">Start Liste ${data.selected} →</button><p class="good" style="margin-top:16px">⚽ Pick a list, score goals and win trophies!</p></div></div>`)}
function selectList(n){data.selected=n;save();choose()}
function dashboard(n){game.list=n;let ws=words(n),s=stats(n),t=teamOf(n);show(`<div class="head"><div><div class="eyebrow" style="color:var(--orange)">${t.flag} YOUR DAILY ADVENTURE</div><h1>Welcome to Liste ${n}, Azi!</h1><p class="muted">${ws.length} approved words · ${s.m} mastered · ${s.pct}% complete</p></div><button class="secondary" onclick="choose()">← All lists</button></div><div class="card" style="border-color:var(--gold)"><b>🏆 Your progress</b><div class="bar"><i style="width:${s.pct}%"></i></div><p class="muted">Your progress is saved automatically.</p></div><div class="stages" style="margin-top:20px"><div class="stage s1"><div class="icon">🔎</div><h2>1. Discover the Word</h2><p>See it, hear it and match it with its meaning.</p><div class="toolbar"><button ${ws.length?'':'disabled'} onclick="start(1,3)">🏆 Champion</button></div></div><div class="stage s2"><div class="icon">🔤</div><h2>2. Spelling Champion</h2><p>Listen and build the word with letter tiles. Watch the accents!</p><div class="toolbar"><button ${ws.length?'':'disabled'} onclick="start(2,3)">🏆 Champion</button></div></div><div class="stage s3"><div class="icon">✍️</div><h2>3. Sentence Master</h2><p>Mixed sentences from the whole list. Listen for the beep and find the missing word.</p><div class="toolbar"><button ${ws.some(w=>sentencesOf(w).length>0)?'':'disabled'} onclick="start(3,3)">🏆 Champion</button></div></div></div>${ws.length?'':'<p class="notice" style="margin-top:18px">This list has no approved words yet. Ask a parent to add vocabulary in Parent Zone.</p>'}`)}
let _ac=null;function beep(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;_ac=_ac||new C();if(_ac.state==='suspended')_ac.resume();let o=_ac.createOscillator(),g=_ac.createGain();o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(.0001,_ac.currentTime);g.gain.exponentialRampToValueAtTime(.45,_ac.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,_ac.currentTime+.42);o.connect(g);g.connect(_ac.destination);o.start();o.stop(_ac.currentTime+.45)}catch(e){}}
function speak(t,cb){cb=cb||function(){};if(!t||!t.trim()||!('speechSynthesis'in window)){cb();return}let done=false,fin=()=>{if(!done){done=true;cb()}};let u=new SpeechSynthesisUtterance(t);u.lang=data.voice;u.rate=.85;try{let vs=speechSynthesis.getVoices(),lg=x=>x.lang.replace('_','-'),v=vs.find(x=>lg(x)===data.voice)||vs.find(x=>lg(x).toLowerCase().startsWith('fr'));if(v)u.voice=v}catch(e){}u.onend=fin;u.onerror=fin;window._u=u;setTimeout(fin,Math.max(2500,t.length*140+1500));speechSynthesis.speak(u)}
function say(t){if(!('speechSynthesis'in window)){alert('Speech is not available in this browser.');return}speechSynthesis.cancel();speak(t)}
function sentRx(f){return new RegExp('(^|[^\\p{L}])('+reEsc(f)+')(?![\\p{L}])','iu')}
function sayBeep(t,f){beep();if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let m=sentRx(f).exec(t);if(!m){speak(t);return}let pre=t.slice(0,m.index+m[1].length),post=t.slice(m.index+m[1].length+m[2].length);setTimeout(()=>speak(pre,()=>{beep();setTimeout(()=>speak(post),450)}),350)}
function sentencePool(ws){let flat=[];for(let w of ws){let rx=sentRx(w.french);for(let t of sentencesOf(w))if(rx.test(t))flat.push({...w,sent:t})}flat=shuffle(flat);let seen={},first=[],rest=[];for(let x of flat){if(seen[x.id])rest.push(x);else{seen[x.id]=1;first.push(x)}}return first.concat(rest)}
function start(stage,level){let pool=words(game.list);if(stage===3)pool=sentencePool(pool);if(!pool.length){alert(stage===3?'No sentences are available in this list yet. Ask a parent to add them.':'No approved words in this list yet.');return}game={...game,stage,level,items:(stage===3?pool:shuffle(pool)).slice(0,Math.min(pool.length,level===1?5:level===2?8:10)),i:0,correct:0,letters:[],used:[],locked:false};question()}
function result(w,ok){let x=p(w);x.attempts++;x.last=new Date().toISOString();if(ok){x.correct++;x[game.stage===1?'discover':game.stage===2?'spell':'sentence']++;data.points+=10;game.correct++}else x.wrong++;save()}
function question(){let w=game.items[game.i];if(!w){finish();return}game.locked=false;game.letters=[];game.used=[];let stageName=['','Discover the Word','Spelling Champion','Sentence Master'][game.stage],body='';
if(game.stage===1){let opts=shuffle([w,...shuffle(words(game.list).filter(x=>x.id!==w.id)).slice(0,game.level+1)]);body=`<div class="muted">Listen to the word and choose its English meaning.</div><div class="word">${esc(w.french)}</div><button class="gold" onclick="say(${esc(JSON.stringify(w.french))})">🔊 Hear the word</button><div class="choices">${opts.map(x=>`<button class="choice" onclick="chooseAnswer('${x.id}')">${esc(x.english||'Translation missing')}</button>`).join('')}</div>`}
if(game.stage===2){let chars=shuffle([...w.french]);body=`<div class="muted">${game.level===3?'Listen and spell the word.':'Tap the letters in the correct order.'}</div>${game.level===3?`<button class="gold" onclick="say(${esc(JSON.stringify(w.french))})">🔊 Hear the word</button>`:`<div class="word" style="font-size:2.4rem">${game.level===1?esc(w.french):'?'}</div>`}<div class="answer" id="answer"></div><div class="tiles">${chars.map((c,i)=>`<button class="tile" id="t${i}" onclick="letter(${i},${esc(JSON.stringify(c))})">${esc(c)}</button>`).join('')}</div><div class="toolbar" style="justify-content:center"><button class="secondary" onclick="undo()">Undo</button><button onclick="checkSpell()">Check spelling</button></div>`}
if(game.stage===3){let t=w.sent,len=w.french.length,wd=Math.max(len+2,6),rx=sentRx(w.french);let others=shuffle(words(game.list).filter(x=>x.id!==w.id&&x.french.toLowerCase()!==w.french.toLowerCase())).slice(0,3).map(x=>x.french);let inp=`<input class="blank" id="b0" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="${'_'.repeat(len)}" style="width:${wd}ch" oninput="typed(0)" onkeydown="blankKey(event,0)">`;let m=rx.exec(t),line=m?esc(t.slice(0,m.index+m[1].length))+inp+esc(t.slice(m.index+m[1].length+m[2].length)):esc(t)+' '+inp;let opts=shuffle([w.french,...others]);body=`<div class="muted">Écris ou choisis le mot qui manque.</div><div class="sent"><p>${line}</p><div class="or">✍️ Type the word, or 👆 tap a choice:</div><div class="opts" id="o0">${opts.map(x=>`<button class="opt" onclick="pick(0,${esc(JSON.stringify(x))},this)">${esc(x)}</button>`).join('')}</div><button class="secondary" onclick="sayBeep(${esc(JSON.stringify(t))},${esc(JSON.stringify(w.french))})">🔊 Écouter (bip)</button></div><div class="toolbar" style="justify-content:center"><button onclick="checkSentences()">✅ Check my answer</button></div>`}
show(`<div class="head"><div><div class="eyebrow" style="color:var(--green)">LISTE ${game.list} · 🏆 CHAMPION</div><h1>${stageName}</h1></div><button class="secondary" onclick="dashboard(${game.list})">✕ Exit</button></div><div class="game"><div class="bar"><i style="width:${Math.round(game.i/game.items.length*100)}%"></i></div><p class="muted">Challenge ${game.i+1} of ${game.items.length} · ⭐ ${data.points}</p>${body}<div id="feedback" class="feedback"></div><button id="next" class="gold hidden" onclick="next()">Next challenge →</button></div>`);}
function chooseAnswer(id){if(game.locked)return;let w=game.items[game.i],ok=id===w.id;game.locked=true;result(w,ok);if(ok)boom();$('feedback').textContent=ok?'⚽ GOAL! Correct! +10 points':`Good try! The answer is ${game.stage===1?w.english:w.french}.`; $('feedback').style.color=ok?'#12804b':'#b23b43';$('next').classList.remove('hidden')}
function letter(i,c){if(game.locked||game.used.includes(i))return;game.used.push(i);game.letters.push({i,c});$('t'+i).disabled=true;$('answer').innerHTML=game.letters.map((x,j)=>`<button class="tile" onclick="removeLetter(${j})">${esc(x.c)}</button>`).join('')}
function removeLetter(j){let x=game.letters.splice(j,1)[0];game.used=game.used.filter(i=>i!==x.i);$('t'+x.i).disabled=false;$('answer').innerHTML=game.letters.map((x,j)=>`<button class="tile" onclick="removeLetter(${j})">${esc(x.c)}</button>`).join('')}
function undo(){if(game.letters.length)removeLetter(game.letters.length-1)}
function checkSpell(){if(game.locked)return;let w=game.items[game.i];if(!game.letters.length)return;$('feedback').textContent='';game.locked=true;let ok=game.letters.map(x=>x.c).join('')===w.french;result(w,ok);if(ok)boom();$('feedback').textContent=ok?'⚽ PERFECT SPELLING! +10 points':`Good effort! Correct spelling: ${w.french}. Watch the accents.`;$('feedback').style.color=ok?'#12804b':'#b23b43';$('next').classList.remove('hidden')}
function next(){game.i++;question()}
function reEsc(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function nf(x){return String(x||'').trim().toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ')}
function boom(){const e=['⚽','⭐','🏆','🎉','🥅','👑','✨'];for(let i=0;i<26;i++){let c=document.createElement('span');c.className='confetti';c.textContent=e[i%e.length];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.4+'s';c.style.fontSize=(18+Math.random()*22)+'px';document.body.appendChild(c);setTimeout(()=>c.remove(),2800)}}
function pick(i,word,btn){if(game.locked)return;let el=$('b'+i);el.value=word;document.querySelectorAll('#o'+i+' .opt').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function typed(i){document.querySelectorAll('#o'+i+' .opt').forEach(b=>b.classList.remove('on'))}
function blankKey(e,i){if(e.key!=='Enter')return;if(game.locked){next();return}let nx=$('b'+(i+1));if(nx)nx.focus();else checkSentences()}
function checkSentences(){if(game.locked)return;let w=game.items[game.i],el=$('b0');if(!el.value.trim()){$('feedback').textContent='✍️ Type or tap a word first!';$('feedback').style.color='#b23b43';return}game.locked=true;let ok=nf(el.value)===nf(w.french);el.readOnly=true;document.querySelectorAll('#o0 .opt').forEach(b=>b.disabled=true);el.classList.add(ok?'ok':'bad');if(!ok)el.insertAdjacentHTML('afterend',`<span class="fix">✔ ${esc(w.french)}</span>`);result(w,ok);if(ok)boom();$('feedback').className='feedback win';$('feedback').textContent=ok?'⚽ GOAL! Perfect spelling! +10 points':`Good try! Correct spelling: ${w.french}. Watch the accents!`;$('feedback').style.color=ok?'#12804b':'#b23b43';$('next').classList.remove('hidden')}
function finish(){data.points+=25;save();setTimeout(boom,100);setTimeout(boom,700);show(`<div class="game"><div style="font-size:4rem">🏆⚽</div><h1>Great work, Azi!</h1><p>You finished this challenge in Liste ${game.list}.</p><div class="big">${game.correct}/${game.items.length} correct</div><p class="muted">25 bonus points for finishing!</p><button onclick="dashboard(${game.list})">Back to Liste ${game.list}</button> <button class="secondary" onclick="choose()">Choose another list</button></div>`)}
function progressPage(){let a=data.words.filter(w=>w.approved&&!w.disabled);show(`<div class="head"><h1>My Progress</h1><button class="secondary" onclick="home()">← Home</button></div><div class="grid"><div class="card">APPROVED WORDS<div class="big">${a.length}</div></div><div class="card">MASTERED WORDS<div class="big">${a.filter(master).length}</div></div><div class="card">POINTS<div class="big">${data.points} ⭐</div></div></div><div class="card" style="margin-top:18px"><h2>Progress by list</h2>${lists().map(n=>`<p><b>Liste ${n}</b> · ${stats(n).m}/${stats(n).count} mastered · ${stats(n).pct}%</p><div class="bar"><i style="width:${stats(n).pct}%"></i></div>`).join('')}</div>`)}
function trophies(){let done=lists().filter(n=>stats(n).count&&stats(n).pct===100);show(`<div class="head"><h1>My Trophies</h1><button class="secondary" onclick="home()">← Home</button></div><div class="card"><div style="font-size:3rem">🏆🌍⚽</div><h2>World Word Champion</h2><p class="muted">Master all eligible stages for the words in a list to earn its trophy.</p>${done.map(n=>`<span class="tag">🏆 Liste ${n}</span>`).join(' ')||'Your trophy shelf is waiting for its first champion!'}</div>`)}
function parentLogin(){show(`<div class="game"><h1>🔒 Parent Zone</h1><p class="muted">Enter your PIN. Default PIN: 1234.</p><label>Parent PIN</label><input id="pin" type="password"><div class="toolbar" style="justify-content:center"><button onclick="if($('pin').value===data.pin)parentPage();else $('err').textContent='Incorrect PIN.'">Enter</button><button class="secondary" onclick="home()">Cancel</button></div><div id="err" class="feedback"></div></div>`)}
function parentPage(){show(`<div class="head"><div><div class="eyebrow" style="color:var(--green)">ADULT SETTINGS</div><h1>Parent Zone</h1></div><button class="secondary" onclick="home()">Exit</button></div><div class="good">The 448 words from Vocabulaire_Listes_1-32.xlsx are preloaded and approved. Each record includes its Liste number, English translation and three French-only example sentences. New imports still require review and approval.</div><div class="grid"><div class="card"><h2>📥 Upload vocabulary</h2><p class="muted">CSV works offline. Excel requires internet for the SheetJS library. Import columns: Mot français, Liste, English translation, Phrase 1, Phrase 2, Phrase 3.</p><input id="file" type="file" accept=".csv,.xlsx,.xls,.json"><button style="margin-top:12px" onclick="importFile()">Preview upload</button></div><div class="card"><h2>✍️ Add a word</h2><div class="formgrid"><div><label>List number</label><select id="ml">${lists().map(n=>`<option value="${n}">Liste ${n}</option>`).join('')}</select></div><div><label>French word *</label><input id="mf"></div><div><label>English translation</label><input id="me"></div><div><label>Phrase 1 (français)</label><textarea id="ms1" rows="2"></textarea><label>Phrase 2 (français)</label><textarea id="ms2" rows="2"></textarea><label>Phrase 3 (français)</label><textarea id="ms3" rows="2"></textarea></div></div><button style="margin-top:10px" onclick="manualAdd()">Add approved word</button></div></div><div id="preview"></div><div class="card" style="margin-top:18px"><div class="head"><h2>Manage vocabulary (${data.words.length})</h2><button class="secondary" onclick="backup()">Backup data</button></div><div class="toolbar"><select id="filter" onchange="wordTable()"><option value="0">All lists</option>${lists().map(n=>`<option value="${n}">Liste ${n}</option>`).join('')}</select><button class="secondary" onclick="exportCsv()">Export CSV</button><label>Restore backup <input type="file" id="restore" accept=".json" onchange="restore()"></label></div><div class="scroll" id="wordsTable"></div></div><div class="card" style="margin-top:18px"><h2>Settings and daily assignment</h2><div class="formgrid"><div><label>French voice</label><select id="voice"><option value="fr-CA">French Canadian</option><option value="fr-FR">French European</option></select></div><div><label>Change PIN</label><input id="newpin" type="password"></div><div><label>Assignment date</label><input id="date" type="date" value="${today()}"></div><div><label>Assigned list</label><select id="assigned">${lists().map(n=>`<option value="${n}">Liste ${n}</option>`).join('')}</select></div></div><div class="toolbar"><button onclick="saveSettings()">Save settings</button><button class="secondary" onclick="assign()">Assign list to date</button></div></div>`);wordTable();$('voice').value=data.voice}
function manualAdd(){let f=$('mf').value.trim();if(!f)return alert('French word is required.');data.words.push({id:crypto.randomUUID?.()||String(Date.now()),list:+$('ml').value,french:f,english:$('me').value.trim(),sentences:[$('ms1').value.trim(),$('ms2').value.trim(),$('ms3').value.trim()],approved:true});save();parentPage();alert('Word added and approved.')}
function norm(k){return String(k).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function field(o,keys){for(let k of Object.keys(o))if(keys.includes(norm(k)))return o[k]??'';return ''}
function row(o){return{id:'i'+Math.random().toString(36).slice(2),list:+field(o,['listenumber','liste','list','listnumber','numero'])||0,french:String(field(o,['frenchword','french','mot','motfrancais','word'])).trim(),english:String(field(o,['englishtranslation','english','translation','meaning','traduction'])).trim(),sentences:[String(field(o,['phrase1facile8ans','phrase1','sentence1'])).trim(),String(field(o,['phrase2','sentence2'])).trim(),String(field(o,['phrase3','sentence3'])).trim()].filter(Boolean),approved:false}}
function csvParse(t){let lines=t.replace(/^\uFEFF/,'').split(/\\r?\\n/).filter(x=>x.trim());let split=s=>{let a=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a};let h=split(lines.shift());return lines.map(l=>Object.fromEntries(split(l).map((v,i)=>[h[i]||'col'+i,v])))}
function importFile(){let f=$('file').files[0];if(!f)return alert('Choose a file.');let ext=f.name.split('.').pop().toLowerCase(),r=new FileReader();r.onload=()=>{try{let rows;if(ext==='json'){let j=JSON.parse(r.result);rows=Array.isArray(j)?j:j.words||[]}else if(ext==='csv')rows=csvParse(r.result);else{if(!window.XLSX)return alert('Excel import needs internet to load SheetJS. Save as CSV or connect and reload.');let wb=XLSX.read(r.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})}pending=rows.map(row).filter(x=>x.french);preview()}catch(e){alert('Could not read file: '+e.message)}};if(ext==='xlsx'||ext==='xls')r.readAsArrayBuffer(f);else r.readAsText(f,'UTF-8')}
function preview(){ $('preview').innerHTML=`<div class="card" style="margin-top:18px"><div class="head"><h2>Review import</h2><span class="tag">${pending.length} pending rows</span></div><div class="notice">Check list numbers and spelling. Nothing is imported until you approve. Invalid list numbers will be skipped.</div><div class="scroll"><table><thead><tr><th>List</th><th>French</th><th>English</th><th>French sentence</th></tr></thead><tbody>${pending.map((w,i)=>`<tr><td><input type="number" min="1" max="32" value="${w.list||''}" onchange="pending[${i}].list=+this.value"></td><td><input value="${esc(w.french)}" onchange="pending[${i}].french=this.value"></td><td><input value="${esc(w.english)}" onchange="pending[${i}].english=this.value"></td><td><textarea rows="2" onchange="pending[${i}].sentence=this.value">${esc(w.sentence)}</textarea>${!w.sentence?'<small>Sentence missing</small>':''}</td></tr>`).join('')}</tbody></table></div><div class="toolbar"><button onclick="approve()">Approve and import valid rows</button><button class="secondary" onclick="pending=[];$('preview').innerHTML=''">Cancel</button></div></div>`}
function approve(){let rows=pending.filter(w=>w.list>=1&&w.list<=32&&w.french.trim());let count=0;for(let w of rows){if(data.words.some(x=>x.list===w.list&&x.french.toLowerCase()===w.french.toLowerCase()))continue;w.approved=true;data.words.push(w);count++}pending=[];save();parentPage();alert(count+' new words imported and approved. Duplicates skipped.')}
function wordTable(){let el=$('wordsTable');if(!el)return;let n=+$('filter').value,arr=data.words.filter(w=>!n||w.list===n);el.innerHTML=`<table><thead><tr><th>List</th><th>French</th><th>English</th><th>Phrase 1 (FR)</th><th>Phrase 2 (FR)</th><th>Phrase 3 (FR)</th><th>Status</th><th>Action</th></tr></thead><tbody>${arr.map(w=>`<tr><td>${w.list}</td><td><b>${esc(w.french)}</b></td><td>${esc(w.english)}</td><td>${esc(sentencesOf(w)[0]||"")}</td><td>${esc(sentencesOf(w)[1]||"")}</td><td>${esc(sentencesOf(w)[2]||"")}</td><td>${w.approved?'Approved':'Pending'}</td><td><button class="secondary" onclick="edit('${w.id}')">Edit</button> <button class="danger" onclick="del('${w.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="8">No words yet.</td></tr>'}</tbody></table>`}
function edit(id){let w=data.words.find(x=>x.id===id);let f=prompt('French word',w.french);if(f===null)return;let e=prompt('English translation',w.english);if(e===null)return;let ss=sentencesOf(w);let s1=prompt('Phrase 1 (French)',ss[0]||'');if(s1===null)return;let s2=prompt('Phrase 2 (French)',ss[1]||'');if(s2===null)return;let s3=prompt('Phrase 3 (French)',ss[2]||'');if(s3===null)return;w.french=f;w.english=e;w.sentences=[s1,s2,s3].filter(Boolean);w.approved=confirm('Approve this word?');save();wordTable()}
function del(id){if(!confirm('Delete this word and its progress?'))return;data.words=data.words.filter(w=>w.id!==id);delete data.progress[id];save();wordTable()}
function saveSettings(){data.voice=$('voice').value;if($('newpin').value)data.pin=$('newpin').value;save();alert('Settings saved.')}
function assign(){let d=$('date').value;if(!d)return alert('Choose a date.');data.assign[d]=+$('assigned').value;save();alert('Daily list assigned.')}
function backup(){download('azi-world-backup.json','application/json',JSON.stringify(data,null,2))}
function restore(){let f=$('restore').files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.words))throw Error('Invalid backup');if(!confirm('Replace current data with this backup?'))return;data={...fresh(),...x};save();parentPage()}catch(e){alert('Restore failed: '+e.message)}};r.readAsText(f)}
function exportCsv(){let a=[['Liste Number','French Word','English Translation','Phrase 1 (French)','Phrase 2 (French)','Phrase 3 (French)'],...data.words.map(w=>[w.list,w.french,w.english,...sentencesOf(w)])];download('azi-vocabulary.csv','text/csv;charset=utf-8',a.map(r=>r.map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n'))}
function download(n,t,s){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:t}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}
home();
</script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script></body></html>
